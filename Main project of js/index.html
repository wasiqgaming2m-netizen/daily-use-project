<!DOCTYPE html>
<html lang="en-US">
<head>
    <meta charset="UTF-8">

    <title>Document</title>

  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css" integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw==" crossorigin="anonymous" referrerpolicy="no-referrer" />
    <style>
        *{
            box-sizing: border-box;
        }

        body{
            background: #7F00FF;
background: linear-gradient(90deg, rgba(127, 0, 255, 0.15) 0%, rgba(225, 0, 255, 0.15) 100%);
animation: pageLoad 0.6s ease;
        }

        #frm{
            margin: 0 auto;
            width:300px;
            height:400px;
            background-color: white;
            box-shadow: 0 5px 10px grey;
            margin-top: 150px;
            border-radius: 10px;
            padding: 01px;
                   
        }

        #h1 , #h11{
            text-align: center;
            font-family: verdana;
            
        }

        #email , #email2{
                        margin-left:10%;
            width:80%;
            height:40px;
            font-size: 25px;
            font-family: sans-serif;
            border:none;
            border-bottom: 1px solid #ccc;
            
            margin-top: 20px;
            outline: none;
        }

        #pass , #pass2{
                        margin-left:10%;
            width:80%;
            height:40px;
            font-size: 25px;
            font-family: sans-serif;
            border:none;
            border-bottom: 1px solid #ccc;
            
            margin-top: 20px;
            outline: none;
        }
        #img_l{
            margin-top: 40px;
            margin-left:10%;
            
            
            cursor: pointer;

        }

        #s_spam , #s_spam2{
            margin-left: 10%;
            font-family: sans-serif;
            
        }

        #frm_2{
            margin: 0 auto;
            width:300px;
            height:500px;
            background-color: white;
            box-shadow: 0 5px 10px grey;
            margin-top: 150px;
            border-radius: 10px;
            padding: 01px;
            display:none;

        }

        #username{
            margin-left:10%;
            width:80%;
            height:40px;
            font-size: 25px;
            font-family: sans-serif;
            border:none;
            border-bottom: 1px solid #ccc;
            
            margin-top: 20px;
            outline: none;
        }

        #number{
            margin-left:10%;
            width:80%;
            height:40px;
            font-size: 25px;
            font-family: sans-serif;
            border:none;
            border-bottom: 1px solid #ccc;
            
            margin-top: 20px;
            outline:none;
        }
        #img_s{
            margin-left: 10%;
            margin-top: 40px;

        }

        #img_s_s{
            margin-left: 10%;
            margin-top: 40px;
            display: none;
        }


        #war_e2 , #pass_not_a_s_e , #email_not_a_s_e{
            font-family:verdana;
            color:red;
            margin-left: 10%;
            margin-top: 5px;
            display: none;
        }
    </style>
</head>
<body>
    <form id="frm" class="animate__animated animate__flip">
        <h1 id="h1">Login</h1>

        <input type="email" name="email"  id="email" placeholder="email Id" required="required">
        <!-- email condition small element -->
        <small id="email_not_a_s_e"><i class="fas fa-exclamation-triangle"></i>Email Not Found...</small>
        <!-- email condition small element closed -->
        <input type="password" name="password" id="pass" placeholder="password" required="required">
        <!-- pass condition small element -->
        <small id="pass_not_a_s_e"><i class="fas fa-exclamation-triangle"></i>Wrong pssword...</small>
        <!-- pass condition small element closed -->
        <a id="login_sub"><img src="images/Login.png" id="img_l"></a>
       <br><br><br><br> <p id="s_spam">Dont't have an account?<a href="#" id="l_s">Sign up!</a></p>
    </form>
<!-------------------------- frm 2 sign up form --------------------------- -->
        <form id="frm_2" class="animate__animated animate__flip">
        <h1 id="h11">Sign up</h1>
        <input type="text" name="username" id="username" placeholder="Name" required="required">
        <input type="email" name="email"  id="email2" placeholder="email Id" required="required"><small id="war_e2"><i class="fas fa-exclamation-triangle"></i>Email Already exists...</small>
        <input type="number" name="number" id="number" placeholder="phone No." required="required">
        <input type="password" name="password" id="pass2" placeholder="password" required="required">
        <a id="img_sl"><img src="images/sign.png" id="img_s" ></a><img src="images/success.png" id="img_s_s">
        <p id="s_spam2">Already have an account?<a href="#" id="s_l">Login!</a></p>
    </form>


    <script src="index.js">
        
</script>
</body>
</html>
